<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hip abduction coach</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Side-lying hip abduction coach</h1>
      <button id="start" class="primary">Start</button>
      <button id="recalibrate" disabled>Recalibrate</button>
      <label class="toggle"><input id="debug-toggle" type="checkbox" /> Debug</label>
    </header>

    <main>
      <div class="stage">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <aside class="readout">
        <div id="state" class="state idle">Press Start</div>
        <div id="detail" class="detail">Laptop on the floor, 2 to 2.5 m away, level with your hips.</div>
        <div class="numbers">
          <div id="angle" class="angle">–</div>
          <div class="reps"><span id="reps">0</span><small>reps</small></div>
        </div>
        <canvas id="gauge" class="gauge" width="640" height="400"></canvas>
        <div id="said" class="said"></div>
      </aside>
    </main>

    <section id="debug" hidden>
      <div class="controls">
        <label>Model
          <select id="variant"></select>
        </label>
        <label>Source
          <select id="source">
            <option value="webcam">Webcam</option>
            <option value="file">Video file</option>
          </select>
        </label>
        <input id="file" type="file" accept="video/*" hidden />
        <label>Rotate input
          <select id="rotation">
            <option value="0">Off</option>
            <option value="90">90° clockwise (head at image-left)</option>
            <option value="-90">90° counter-clockwise (head at image-right)</option>
          </select>
        </label>
        <button id="record">Record trace</button>
        <button id="download" disabled>Download trace</button>
        <span id="record-status"></span>
      </div>
      <div class="tables">
        <table id="debug-values"></table>
        <table id="debug-visibility"></table>
        <pre id="debug-events"></pre>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
